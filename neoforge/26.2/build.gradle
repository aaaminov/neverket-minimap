plugins {
	id "net.neoforged.moddev"
}

base {
	archivesName = "${rootProject.archives_base_name}-neoforge"
}

tasks.withType(org.gradle.api.tasks.bundling.AbstractArchiveTask).configureEach {
	archiveVersion = "${project.version}-mc26.2"
}

sourceSets.main {
	java.srcDirs(rootProject.file("src/main/java"), rootProject.file("src/client26/java"))
	resources.srcDir(rootProject.file("src/main/resources"))
}

neoForge {
	version = rootProject.neoforge_26_2_version

	runs {
		client {
			client()
			gameDirectory = project.file("run")
		}
	}

	mods {
		"neverket_minimap" {
			sourceSet sourceSets.main
		}
	}
}

processResources {
	def properties = [
		version: project.version,
		minecraft_version: rootProject.minecraft_26_2_version,
		neoforge_version: rootProject.neoforge_26_2_version
	]
	inputs.properties properties
	filesMatching("META-INF/neoforge.mods.toml") {
		expand properties
	}
}

tasks.withType(JavaCompile).configureEach {
	options.release = 25
	options.encoding = "UTF-8"
}

java {
	withSourcesJar()
	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}
